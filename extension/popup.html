<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnLoop Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 330px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 14px;
    }
    .logo-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #7c3aed, #3b82f6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      color: white;
    }
    .title {
      font-size: 14px;
      font-weight: 800;
      background: linear-gradient(135deg, #c4b5fd, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-pill {
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-connected {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .status-disconnected {
      background: rgba(244, 63, 94, 0.2);
      color: #fb7185;
      border: 1px solid rgba(244, 63, 94, 0.3);
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .label {
      font-size: 11px;
      color: #cbd5e1;
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .input {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 8px 10px;
      color: white;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input:focus {
      border-color: #8b5cf6;
    }
    .btn-save {
      width: 100%;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border: none;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.15s;
    }
    .btn-save:hover {
      opacity: 0.92;
    }
    .submissions-box {
      margin-top: 14px;
    }
    .submission-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sub-title {
      font-size: 11px;
      font-weight: 700;
      color: #f1f5f9;
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sub-meta {
      font-size: 9px;
      color: #94a3b8;
      margin-top: 2px;
    }
    .sub-time {
      font-family: monospace;
      font-size: 11px;
      font-weight: 800;
      color: #a78bfa;
    }
    .empty-state {
      text-align: center;
      font-size: 11px;
      color: #64748b;
      padding: 16px 0;
    }
    .footer-link {
      display: block;
      text-align: center;
      font-size: 11px;
      color: #a78bfa;
      text-decoration: none;
      margin-top: 14px;
      font-weight: 700;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .footer-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-box">
      <div class="logo-icon">LL</div>
      <div>
        <div class="title">LearnLoop Companion</div>
      </div>
    </div>
    <div id="conn-status" class="status-pill status-connected">
      <span class="dot"></span>
      <span id="conn-text">Active</span>
    </div>
  </div>

  <div class="form-group">
    <label class="label">LeetCode Username</label>
    <input type="text" id="input-username" class="input" placeholder="e.g. arpitgrover3113" />
  </div>

  <div class="form-group">
    <label class="label">LearnLoop Backend URL</label>
    <input type="text" id="input-backend" class="input" value="http://localhost:5001/api" />
  </div>

  <button id="btn-save" class="btn-save">Save Settings</button>

  <div class="submissions-box">
    <div class="section-title">Recent Synced Solves</div>
    <div id="submissions-list">
      <div class="empty-state">No solves recorded yet.<br>Open any LeetCode problem to begin tracking!</div>
    </div>
  </div>

  <a href="http://localhost:3000" target="_blank" class="footer-link">
    Open LearnLoop Dashboard ↗
  </a>

  <script src="popup.js"></script>
</body>
</html>
